# Ruff configuration for the fork-local overlay.
#
# Kept here rather than added to `python/pyproject.toml` on purpose: the overlay's
# defining property is that it changes zero upstream files, so it carries its own
# config instead of editing one this fork tracks.
#
# The style matches upstream — same line length, same target version, same `select =
# ALL` with the same base ignores — so overlay code reads like the code around it.
# Two deliberate departures are documented below.

target-version = "py312"
line-length = 100

[lint]
select = ["ALL"]

ignore = [
  "COM812",  # Ruff formatter controls trailing commas
  "D200",    # One-line docstrings use the multi-line form by convention
  "D203",    # Conflicts with D211
  "D212",    # Summaries start on the second line by convention; D213 applies instead
  "EM101",   # Exception messages stay inline
  "EM102",   # Exception messages stay inline
  "TRY003",  # Exception messages stay inline
  # Departure 1: no copyright header. Upstream requires its own copyright notice on
  # every file it owns. These files are fork-local and not upstream contributions, so
  # asserting Nautech's copyright on them would be wrong, and inventing a different
  # header in files that sit inside this tree would be more confusing than none.
  "CPY001",
  # Departure 3: type-checking-block import rules. Moving runtime-used imports behind
  # `if TYPE_CHECKING` buys nothing in a package this size and makes dataclass field
  # types depend on postponed evaluation to stay working. The fragility outweighs the
  # import-time saving here.
  "TC001",
  "TC003",
  # Departure 4: f-strings in log calls. Nautilus's logger is `info(message, color)` —
  # it takes an already-formatted string and offers no %-style lazy formatting, so the
  # deferred-interpolation benefit this rule protects does not exist here.
  "G004",
]

fixable = ["ALL"]
unfixable = ["E4", "E501", "UP006", "UP035"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Departure 2: the overlay's tests live at `copilot/tests/`, which upstream's
# `tests/**` exemption does not match. This mirrors that exemption so overlay tests
# are held to the same standard as upstream's own, no looser.
[lint.per-file-ignores]
# Operator-facing command line tools. Printing a report to stdout is the entire
# purpose, so `print` is the interface rather than a stray debug statement. Upstream
# exempts its own `examples/**` from T20 for the same reason.
"calibration/*.py" = ["T201"]

# Same reason: `backfill.py` is an operator command whose output *is* the product.
# Its rejection report is what tells someone a run quietly dropped rows, so printing
# it is the interface, not a leftover debug statement.
"data/backfill.py" = ["T201"]

# The Marketstack client's constructor carries its endpoint, paging and retry policy
# as separate keyword arguments. Collapsing them into a config object would hide which
# defaults the policy actually specifies — the same reasoning applied to the gate's
# knobs below, and every one of them is keyword-only at the call site.
"data/marketstack.py" = ["PLR0913"]

# `upstream_delta.py` is an operator command and a report is its whole output. It also
# shells out to git with fixed argument lists and no shell, which is what S603/S607 are
# about; the per-call `noqa`s carry the reasoning.
"tools/*.py" = ["T201"]

# The gate's public functions take an intentionally opaque parameter set and a Nautilus
# instrument whose concrete type this overlay deliberately does not depend on, so `Any`
# is the accurate annotation rather than a missing one. `walk_forward` also carries the
# original's full knob set; collapsing them into a config object would hide which
# defaults the methodology actually specifies.
"validation/*.py" = ["ANN401", "PLR0913"]
"risk/guard.py" = ["ANN401"]
"tests/**/*.py" = [
  "A002",
  "ANN001",
  "ANN201",
  "ANN202",
  "ANN401",
  "ARG001",
  "ARG002",
  "ARG004",
  "ARG005",
  "ASYNC110",
  "BLE001",
  "D",
  "E402",
  "E501",
  "E711",
  "FBT001",
  "FBT002",
  "FBT003",
  "INP001",
  "ISC004",
  "PLC0206",
  "PLC0415",
  "PLR0124",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "PT011",
  "PT019",
  "PTH103",
  "S101",
  "S105",
  "S106",
  "S301",
  "S603",
  "SLF001",
  "TC001",
  "TC003",
]
